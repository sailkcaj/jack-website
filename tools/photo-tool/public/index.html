<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sailkcaj.com — Photo Tool</title>
<style>
  :root {
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --border: #E2E4E8;
    --text: #171A20;
    --text-2: #565C68;
    --text-3: #8A8F99;
    --accent: #2F80D6;
    --accent-bg: #E7F1FC;
    --danger: #D6412F;
    --danger-bg: #FBE9E7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1C24;
      --panel: #262A36;
      --border: #383D4C;
      --text: #EEEFF2;
      --text-2: #A3A8B4;
      --text-3: #6E7380;
      --accent: #5EB1F0;
      --accent-bg: #1B3A54;
      --danger: #F0796A;
      --danger-bg: #3A2220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 1.5rem 2rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 0 0.25rem 0; }
  header p { font-size: 13px; color: var(--text-2); margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  section { margin-bottom: 2.5rem; }
  section h2 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-2);
    margin: 0 0 1rem 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }
  .slot {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--panel);
    border: 1.5px dashed var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .slot.filled { border-style: solid; border-color: var(--border); }
  .slot.dragover { border-color: var(--accent); background: var(--accent-bg); }
  .slot .placeholder { padding: 0.75rem; }
  .slot .placeholder .icon { font-size: 22px; color: var(--text-3); margin-bottom: 0.4rem; }
  .slot .placeholder .label { font-size: 12px; color: var(--text-2); line-height: 1.35; }
  .slot img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .slot .label-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    color: #fff;
    font-size: 11px;
    padding: 1.1rem 0.5rem 0.4rem 0.5rem;
    text-align: left;
    pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot .toolbar {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 4px;
  }
  .slot .toolbar button {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .slot .toolbar button:hover { background: rgba(0,0,0,0.8); }
  .slot .toolbar button.confirm-danger { background: var(--danger); }
  .slot select.move-select {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }
  input[type=file] { display: none; }
  #toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg);
    padding: 0.6rem 1rem; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>sailkcaj.com — Photo Tool</h1>
  <p>Drag a photo onto any box below, or click a box to browse. HEIC, PNG, JPEG — anything works; it's converted and resized automatically. Runs only on this machine.</p>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(message, isError) {
  toastEl.textContent = message;
  toastEl.className = isError ? 'show error' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ''; }, 2600);
}

function iconFor(category) {
  if (category === 'Profile') return '🙂';
  if (category === 'Company logos') return '🏢';
  if (category === 'Project screenshots') return '🖥️';
  if (category === 'Acting & modeling') return '🎬';
  return '📍';
}

let slots = [];

async function loadSlots() {
  const res = await fetch('/api/slots');
  slots = await res.json();
  render();
}

async function uploadTo(slotId, file) {
  if (!file) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif|jpg|jpeg|png|gif|webp|bmp|tiff?)$/i.test(file.name)) {
    toast('That doesn\'t look like an image file', true);
    return;
  }
  const form = new FormData();
  form.append('slotId', slotId);
  form.append('photo', file);
  toast('Saving…');
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    const i = slots.findIndex((s) => s.id === slotId);
    if (i !== -1) slots[i] = data.slot;
    render();
    toast('Saved');
  } catch (err) {
    toast(err.message, true);
  }
}

async function moveTo(fromSlotId, toSlotId) {
  try {
    const res = await fetch('/api/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fromSlotId, toSlotId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Move failed');
    const fi = slots.findIndex((s) => s.id === fromSlotId);
    const ti = slots.findIndex((s) => s.id === toSlotId);
    if (fi !== -1) slots[fi] = data.from;
    if (ti !== -1) slots[ti] = data.to;
    render();
    toast('Moved');
  } catch (err) {
    toast(err.message, true);
  }
}

async function deleteSlot(slotId) {
  try {
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slotId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Delete failed');
    const i = slots.findIndex((s) => s.id === slotId);
    if (i !== -1) slots[i] = data.slot;
    render();
    toast('Removed');
  } catch (err) {
    toast(err.message, true);
  }
}

function buildSlotEl(slot) {
  const el = document.createElement('div');
  el.className = 'slot' + (slot.exists ? ' filled' : '');

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,.heic,.heif';
  input.addEventListener('change', () => uploadTo(slot.id, input.files[0]));
  el.appendChild(input);

  if (slot.exists) {
    const img = document.createElement('img');
    img.src = slot.url;
    img.alt = slot.label;
    el.appendChild(img);

    const bar = document.createElement('div');
    bar.className = 'label-bar';
    bar.textContent = slot.label;
    el.appendChild(bar);

    const toolbar = document.createElement('div');
    toolbar.className = 'toolbar';

    const moveBtn = document.createElement('button');
    moveBtn.textContent = '⇄';
    moveBtn.title = 'Move to a different slot';
    moveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openMovePicker(el, slot);
    });
    toolbar.appendChild(moveBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.title = 'Delete';
    let confirming = false;
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirming) {
        confirming = true;
        delBtn.textContent = '✓?';
        delBtn.classList.add('confirm-danger');
        setTimeout(() => {
          if (confirming) { confirming = false; delBtn.textContent = '✕'; delBtn.classList.remove('confirm-danger'); }
        }, 2500);
      } else {
        deleteSlot(slot.id);
      }
    });
    toolbar.appendChild(delBtn);

    el.appendChild(toolbar);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.innerHTML = `<div class="icon">${iconFor(slot.category)}</div><div class="label">${slot.label}</div>`;
    el.appendChild(ph);
  }

  el.addEventListener('click', (e) => {
    if (e.target === input) return;
    if (el.querySelector('select.move-select')) return;
    input.click();
  });

  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    uploadTo(slot.id, file);
  });

  return el;
}

function openMovePicker(el, slot) {
  const select = document.createElement('select');
  select.className = 'move-select';
  const blank = document.createElement('option');
  blank.textContent = 'Move to…';
  blank.value = '';
  select.appendChild(blank);

  let currentCategory = null;
  for (const s of slots) {
    if (s.id === slot.id) continue;
    if (s.category !== currentCategory) {
      currentCategory = s.category;
    }
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.category} — ${s.label}${s.exists ? ' (swap)' : ''}`;
    select.appendChild(opt);
  }

  select.addEventListener('click', (e) => e.stopPropagation());
  select.addEventListener('change', () => {
    if (select.value) moveTo(slot.id, select.value);
    select.remove();
  });
  select.addEventListener('blur', () => select.remove());
  el.appendChild(select);
  select.focus();
}

function render() {
  app.innerHTML = '';
  const categories = [];
  for (const s of slots) if (!categories.includes(s.category)) categories.push(s.category);

  for (const category of categories) {
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = category;
    section.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const slot of slots.filter((s) => s.category === category)) {
      grid.appendChild(buildSlotEl(slot));
    }
    section.appendChild(grid);
    app.appendChild(section);
  }
}

// Prevent an errant drop outside a box from navigating the tab to the raw file.
['dragover', 'drop'].forEach((evt) => {
  window.addEventListener(evt, (e) => e.preventDefault());
});

loadSlots();
</script>
</body>
</html>
